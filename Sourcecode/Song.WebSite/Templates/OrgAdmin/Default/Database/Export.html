<!DOCTYPE html>
<html lang="en">

<head resource>
    <meta charset="utf-8">
    <include file="../inc/meta.inc" />
    <title>数据字典导出</title>
</head>

<body>
    <div id="vapp" v-cloak>
        <div class="toolsbar">
            <btngroup show="导出" ref='btngroup' @output="exportbtn"></btngroup>
            <query_panel :width="45" :loading="loading" @search="handleCurrentChange(1)">
                <el-form-item label="">
                    <el-input v-model="search" clearable placeholder="名称" style="width:100px"></el-input>
                </el-form-item>
            </query_panel>
        </div>
        <el-card shadow="hover">
            <template slot="header">
                <span icon="&#xa017">数据字典
                    <span>({{files.length}})</span>
                </span>
                <span icon="&#xa018">
                    总大小 <b>{{files.reduce((sum, item) => sum + item.size, 0)|size}}</b>
                </span>
            </template>
            <loading v-if="loading" asterisk>loading ...</loading>
            <el-empty v-else-if="files.length<1" description="没有文件，请点击左上方“导出”按钮"></el-empty>
            <dl class="files" v-else>
                <dd v-for="(f,i) in files">
                    <a :href="f.url" :filetype="f.type" target="_blank" title="点击下载" :download="f.file"
                        v-html="showsearch(f.file,search)">
                        {{f.file}}</a>
                    <span icon="&#xe81a">{{f.date|date("yyyy-MM-dd HH:mm:ss")}}</span>
                    <span>{{f.size|size}}</span>
                    <el-popconfirm title="确定删除这个文件吗？" @confirm="deleteFile(f.file)">
                        <el-link type="danger" icon="el-icon-delete" v-loading="loading" slot="reference">删除
                        </el-link>
                    </el-popconfirm>

                </dd>
            </dl>

        </el-card>

    </div>
</body>

</html>
