<!DOCTYPE html>
<html lang="en">

<head resource>
    <meta charset="utf-8">
    <include file="../inc/meta.inc" />
    <title>数据库字段检索</title>
</head>

<body>
    <div id="vapp" v-cloak>
        <el-form :inline="true" :model="form">
            <el-form-item label="数据类型">
                <el-select v-model="form.dbtype" filterable clearable placeholder="请选择">
                    <el-option v-for="(item,idx) in datatypes" :key="item" :label="item" :value="item">
                        {{idx+1}}. {{item}}
                    </el-option>
                </el-select>
            </el-form-item>
            <el-form-item label="表名">
                <el-select v-model="form.table" filterable clearable placeholder="请选择">
                    <el-option v-for="(item,idx) in tables" :key="item" :label="item" :value="item">
                        {{idx+1}}. {{item}}
                    </el-option>
                </el-select>
            </el-form-item>
            <el-form-item label="字段名">
                <el-input v-model="form.field" clearable placeholder="请输入"></el-input>
            </el-form-item>
            <el-form-item>
                <el-button type="primary" @click="onSubmit" :loading="loading">查询</el-button>
            </el-form-item>
        </el-form>
        <section v-if="isEmpty">
            <help multi>
                说明：<br />
                本功能用于查询数据库中的字段，可以按数据类型和字段名（模糊）进行查询。
            </help>
        </section>
        <loading v-else-if="loading" asterisk>loading ...</loading>     
        <template v-else>
            <el-divider content-position="left">共查询到 {{tabletotal}} 张表，{{fieldtotal}}个字段</el-divider>
            <section>
                <el-card v-for="(val,key,idx) in results" shadow="hover">
                    <template slot="header">
                        <span class="index">{{idx+1}}.</span>
                        <span class="field-name" icon="&#xa021" blue>表：{{key}} </span>
                        <el-tag icon="&#xe6cb" type="warning">字段数：{{val.length}}</el-tag>
                    </template>
                    <dl>
                        <dd v-for="(val,i) in val"><span class="index">{{idx+1}}.{{i+1}} .</span> {{val}}</dd>
                    </dl>
                </el-card>
            </section>
        </template>


    </div>
</body>

</html>
